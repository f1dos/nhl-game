name: Sync real scouting leagues
on:
  push:
    branches: [feature/roster-farm-scouting-leagues]
permissions:
  contents: write
jobs:
  sync:
    if: "!contains(github.event.head_commit.message, '[scouting-data]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync:scouting
      - name: Commit verified league snapshot
        run: |
          if ! git diff --quiet -- src/data/scouting-leagues-2026-27.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/scouting-leagues-2026-27.ts
            git commit -m "[scouting-data] Sync real 2026-27 WHL USHL SHL Liiga players"
            git push
          fi
