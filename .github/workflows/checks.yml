name: Test and build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build offline character review
        if: github.event_name == 'pull_request' && (github.head_ref == 'feature/nextgen-hockey-3d' || github.head_ref == 'feature/blender-match-characters')
        run: npm run build:preview
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && (github.head_ref == 'feature/nextgen-hockey-3d' || github.head_ref == 'feature/blender-match-characters')
        with:
          name: hockey-character-review
          path: |
            dist/downloads/NHL-Manager-27-model-lab.html
            dist/downloads/NHL-Manager-27-broadcast-demo.html
          if-no-files-found: error
