name: Deploy browser preview
# Publishes the game to GitHub Pages on every push to main:
#   https://<owner>.github.io/<repo>/                  full game
#   https://<owner>.github.io/<repo>/?demo=broadcast   live match broadcast
# One-time setup: Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Stays green until Pages is switched on in the repository settings.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build --base ./ --outDir site
      - run: npm run build:preview && cp dist/downloads/NHL-Manager-27-*.html site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
